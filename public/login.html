<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Bus Tracker</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0b0e14;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center}
    .login-box{background:#111827;border-radius:20px;padding:40px;width:380px;border:1px solid #1f2937;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .logo{text-align:center;margin-bottom:30px}
    .logo h1{font-size:24px;background:linear-gradient(135deg,#25d366,#128c7e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .logo .dev{font-size:11px;color:#6b7280;margin-top:4px}.logo .dev span{color:#25d366}
    .logo .icon{font-size:48px;margin-bottom:10px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:12px;color:#9ca3af;margin-bottom:6px}
    .form-group input{width:100%;padding:12px 16px;border:2px solid #1f2937;border-radius:10px;background:#0b0e14;color:#fff;font-size:15px;transition:border-color .2s}
    .form-group input:focus{outline:none;border-color:#25d366}
    .btn{width:100%;padding:14px;border:none;border-radius:10px;background:#25d366;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;margin-top:8px}
    .btn:hover{filter:brightness(1.1)}
    .btn:active{transform:scale(.98)}
    .error{background:#7f1d1d;color:#f87171;padding:10px;border-radius:8px;font-size:13px;text-align:center;margin-bottom:12px;display:none}
    .error.show{display:block}
    .register-link{text-align:center;margin-top:16px;font-size:13px;color:#6b7280}
    .register-link a{color:#25d366;text-decoration:none;cursor:pointer}
    .role-tabs{display:flex;gap:4px;margin-bottom:20px;background:#0b0e14;border-radius:10px;padding:4px}
    .role-tab{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:#6b7280;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
    .role-tab.active{background:#25d366;color:#fff}
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="icon">🚌</div>
      <h1>تتبع الحافلات</h1>
      <div class="dev">by <span>Najed Al-Eizari</span></div>
    </div>

    <div class="role-tabs">
      <button class="role-tab active" onclick="switchRole('admin')">المدير</button>
      <button class="role-tab" onclick="switchRole('driver')">السائق</button>
    </div>

    <div class="error" id="error"></div>

    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور">
    </div>

    <button class="btn" onclick="login()">تسجيل الدخول</button>
  </div>

  <script>
    let loginRole = 'admin';

    function switchRole(role) {
      loginRole = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');

      if (!username || !password) {
        errorEl.textContent = 'أدخل اسم المستخدم وكلمة المرور';
        errorEl.classList.add('show');
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error;
          errorEl.classList.add('show');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        if (data.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/driver/app.html';
        }
      } catch (e) {
        errorEl.textContent = 'خطأ في الاتصال بالسيرفر';
        errorEl.classList.add('show');
      }
    }

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    // Check if already logged in
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (token && user) {
      if (user.role === 'admin') window.location.href = '/admin.html';
      else window.location.href = '/driver/app.html';
    }
  </script>
</body>
</html>
